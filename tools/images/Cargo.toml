[package]
name = "brouillon-images"
version = "0.1.0"
edition = "2021"
publish = false
description = "Share images, image pipeline and image checks for Brouillon. Not part of the Brouillon workspace."

[workspace]

[dependencies]
resvg = { version = "0.46", default-features = false }
ttf-parser = "0.25"
png = "0.17"
oxipng = { version = "10", default-features = false, features = ["zopfli"] }
image-webp = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
sha2 = "0.10"

[profile.release]
opt-level = 3
