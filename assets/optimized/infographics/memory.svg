<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" aria-labelledby="memory-t memory-d"><title id="memory-t">Idle memory of Brouillon: 294.6 MB, 151.7 MB, 60.9 MB</title><desc id="memory-d">Horizontal bars of the process working set at rest on one Windows 11 machine with an Intel iGPU. Empty document: 294.6 MB with Vulkan before the work, 151.7 MB with Direct3D 12, 60.9 MB with the CPU renderer, which is the default. With a 100,000-line file: 351.7, 201.0 and 94.2 MB. The goal of under 80 MB is an objective and is met only by the CPU renderer on an empty document.</desc><style>svg{--bg:#14151c;--sf:#1a1b26;--s2:#222436;--tx:#c0caf5;--mu:#9aa3c7;--fa:#7b84a8;--ac:#7aa2f7;--ag:#bb9af7;--ok:#9ece6a;--wn:#e0af68;--bd:#2b2e40;--bc:#5a6184;--oa:#0e0f14}@media(prefers-color-scheme:light){svg{--bg:#fbfaf7;--sf:#f1f0eb;--s2:#e8e6df;--tx:#1a1b26;--mu:#4a4f6a;--fa:#5c6283;--ac:#2f4fd0;--ag:#7a3fd0;--ok:#3d6b12;--wn:#8a5a00;--bd:#dcdad2;--bc:#8a8fa6;--oa:#ffffff}}.fbg{fill:#14151c;fill:var(--bg)}.sbg{stroke:#14151c;stroke:var(--bg)}.fsf{fill:#1a1b26;fill:var(--sf)}.ssf{stroke:#1a1b26;stroke:var(--sf)}.fs2{fill:#222436;fill:var(--s2)}.ss2{stroke:#222436;stroke:var(--s2)}.ftx{fill:#c0caf5;fill:var(--tx)}.stx{stroke:#c0caf5;stroke:var(--tx)}.fmu{fill:#9aa3c7;fill:var(--mu)}.smu{stroke:#9aa3c7;stroke:var(--mu)}.ffa{fill:#7b84a8;fill:var(--fa)}.sfa{stroke:#7b84a8;stroke:var(--fa)}.fac{fill:#7aa2f7;fill:var(--ac)}.sac{stroke:#7aa2f7;stroke:var(--ac)}.fag{fill:#bb9af7;fill:var(--ag)}.sag{stroke:#bb9af7;stroke:var(--ag)}.fok{fill:#9ece6a;fill:var(--ok)}.sok{stroke:#9ece6a;stroke:var(--ok)}.fwn{fill:#e0af68;fill:var(--wn)}.swn{stroke:#e0af68;stroke:var(--wn)}.fbd{fill:#2b2e40;fill:var(--bd)}.sbd{stroke:#2b2e40;stroke:var(--bd)}.fbc{fill:#5a6184;fill:var(--bc)}.sbc{stroke:#5a6184;stroke:var(--bc)}.foa{fill:#0e0f14;fill:var(--oa)}.soa{stroke:#0e0f14;stroke:var(--oa)}text{font:13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#c0caf5;fill:var(--tx)}.h{font-size:20px;font-weight:600}.sm{font-size:12px}.b{font-weight:600}.m{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}.e{text-anchor:end}.c{text-anchor:middle}.n{fill:none}</style><rect class="fbg" width="100%" height="100%"/><rect class="fac" x="24" y="20" width="3" height="24"/><rect class="fag" x="33" y="20" width="3" height="24" opacity=".6"/><text class="h" x="50" y="40">Idle memory: 294.6 MB down to 60.9 MB</text><text class="fmu sm" x="24" y="66">Working set of the process at rest, in MB, lower is better. Measured, one machine. The 80 MB goal is an</text><text class="fmu sm" x="24" y="81">objective, not a result.</text><text class="sm b" x="24" y="104">Empty document</text><text class="sm b" x="24" y="276">With a 100,000-line file (7.3 MB)</text><line class="sok" x1="298" y1="92" x2="298" y2="424" stroke-width="2" stroke-dasharray="6 4"/><text class="fok sm b" x="304" y="104">Goal: under 80 MB (objective)</text><text class="ffa sm e" x="790" y="104">range of runs</text><text class="ftx" x="24" y="134">Before (Vulkan)</text><rect class="fs2 sbc" x="190" y="112" width="397.7" height="34" rx="3"/><text class="ftx b" font-size="15" x="200" y="134">294.6 MB</text><text class="fmu sm e" x="790" y="134">range not stated</text><text class="ftx" x="24" y="180">Direct3D 12</text><rect class="fwn" x="190" y="158" width="204.8" height="34" rx="3"/><text class="foa b" font-size="15" x="200" y="180">151.7 MB</text><text class="fmu sm e" x="790" y="180">151.6–153.4</text><text class="ftx" x="24" y="226">CPU renderer (default)</text><rect class="fac" x="190" y="204" width="82.2" height="34" rx="3"/><text class="foa b" font-size="15" x="200" y="226">60.9 MB</text><text class="fmu sm e" x="790" y="226">60.9–61.1</text><text class="ftx" x="24" y="306">Before (Vulkan)</text><rect class="fs2 sbc" x="190" y="284" width="474.8" height="34" rx="3"/><text class="ftx b" font-size="15" x="200" y="306">351.7 MB</text><text 