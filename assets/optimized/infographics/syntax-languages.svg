y="303" r="5"/><rect class="fsf sbd" x="150" y="284" width="116" height="38" rx="5"/><text class="ftx b" x="162" y="308">TOML</text><rect class="fsf sbd" x="276" y="284" width="116" height="38" rx="5"/><text class="ftx b" x="288" y="308">TypeScript</text><rect class="fsf sbd" x="402" y="284" width="116" height="38" rx="5"/><text class="ftx b" x="414" y="308">Visual Basic</text><rect class="fsf sbd" x="528" y="284" width="116" height="38" rx="5"/><text class="ftx b" x="540" y="308">XML</text><rect class="fsf sbd" x="654" y="284" width="116" height="38" rx="5"/><text class="ftx b" x="666" y="308">YAML</text><circle class="fac" cx="30" cy="354" r="5"/><text class="fmu sm" x="42" y="358">Seen coloured on a real screen capture (9 of 30, report 44 scenario l). The other 21 have a definition and tests, not a screen check.</text><rect class="n sag" x="24" y="372" width="12" height="12" rx="2" stroke-width="1.5"/><text class="fmu sm" x="42" y="382">Rust uses tree-sitter (full re-parse after each change). Others: lexical rules from data files.</text><text class="ffa sm" x="24" y="420">Source: ls crates/brouillon-editor-engine/src/syntax/langs (29 .toml), re/44 scenario l, re/43 section 4. No claim of coverage beyond this list.</text></svg>