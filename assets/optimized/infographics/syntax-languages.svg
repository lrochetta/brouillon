<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="syntax-t syntax-d"><title id="syntax-t">30 highlighted languages</title><desc id="syntax-d">Thirty chips: Batch, C, C++, C#, CSS, Diff, Dockerfile, Go, HTML, INI, Java, JavaScript, JSON, Log, Lua, Makefile, Markdown, Perl, PHP, PowerShell, Python, Ruby, Rust, Shell, SQL, TOML, TypeScript, Visual Basic, XML, YAML. Twenty-nine come from definition files, Rust from a tree-sitter grammar. Nine were seen coloured on screen: C, PHP, HTML, SQL, Python, Rust, JSON, Markdown, Shell.</desc><style>svg{--bg:#14151c;--sf:#1a1b26;--s2:#222436;--tx:#c0caf5;--mu:#9aa3c7;--fa:#7b84a8;--ac:#7aa2f7;--ag:#bb9af7;--ok:#9ece6a;--wn:#e0af68;--bd:#2b2e40;--bc:#5a6184;--oa:#0e0f14}@media(prefers-color-scheme:light){svg{--bg:#fbfaf7;--sf:#f1f0eb;--s2:#e8e6df;--tx:#1a1b26;--mu:#4a4f6a;--fa:#5c6283;--ac:#2f4fd0;--ag:#7a3fd0;--ok:#3d6b12;--wn:#8a5a00;--bd:#dcdad2;--bc:#8a8fa6;--oa:#ffffff}}.fbg{fill:#14151c;fill:var(--bg)}.sbg{stroke:#14151c;stroke:var(--bg)}.fsf{fill:#1a1b26;fill:var(--sf)}.ssf{stroke:#1a1b26;stroke:var(--sf)}.fs2{fill:#222436;fill:var(--s2)}.ss2{stroke:#222436;stroke:var(--s2)}.ftx{fill:#c0caf5;fill:var(--tx)}.stx{stroke:#c0caf5;stroke:var(--tx)}.fmu{fill:#9aa3c7;fill:var(--mu)}.smu{stroke:#9aa3c7;stroke:var(--mu)}.ffa{fill:#7b84a8;fill:var(--fa)}.sfa{stroke:#7b84a8;stroke:var(--fa)}.fac{fill:#7aa2f7;fill:var(--ac)}.sac{stroke:#7aa2f7;stroke:var(--ac)}.fag{fill:#bb9af7;fill:var(--ag)}.sag{stroke:#bb9af7;stroke:var(--ag)}.fok{fill:#9ece6a;fill:var(--ok)}.sok{stroke:#9ece6a;stroke:var(--ok)}.fwn{fill:#e0af68;fill:var(--wn)}.swn{stroke:#e0af68;stroke:var(--wn)}.fbd{fill:#2b2e40;fill:var(--bd)}.sbd{stroke:#2b2e40;stroke:var(--bd)}.fbc{fill:#5a6184;fill:var(--bc)}.sbc{stroke:#5a6184;stroke:var(--bc)}.foa{fill:#0e0f14;fill:var(--oa)}.soa{stroke:#0e0f14;stroke:var(--oa)}text{font:13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#c0caf5;fill:var(--tx)