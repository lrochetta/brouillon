<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="status-t status-d"><title id="status-t">Status matrix: shipped, engine ready without interface, envisaged</title><desc id="status-d">Seventeen domains. Shipped and seen on screen: typing and tabs, search and replace, encodings, syntax colouring, crash recovery, user tools and palette, 100 MB files. Shipped, unit tests only: durable save and backups. Engine ready without interface: multiple carets, Replace in Files, Quick Open and editors, external change watch, agents and MCP. Envisaged: SSH, plugins, notes, collaboration.</desc><style>svg{--bg:#14151c;--sf:#1a1b26;--s2:#222436;--tx:#c0caf5;--mu:#9aa3c7;--fa:#7b84a8;--ac:#7aa2f7;--ag:#bb9af7;--ok:#9ece6a;--wn:#e0af68;--bd:#2b2e40;--bc:#5a6184;--oa:#0e0f14}@media(prefers-color-scheme:light){svg{--bg:#fbfaf7;--sf:#f1f0eb;--s2:#e8e6df;--tx:#1a1b26;--mu:#4a4f6a;--fa:#5c6283;--ac:#2f4fd0;--ag:#7a3fd0;--ok:#3d6b12;--wn:#8a5a00;--bd:#dcdad2;--bc:#8a8fa6;--oa:#ffffff}}.fbg{fill:#14151c;fill:var(--bg)}.sbg{stroke:#14151c;stroke:var(--bg)}.fsf{fill:#1a1b26;fill:var(--sf)}.ssf{stroke:#1a1b26;stroke:var(--sf)}.fs2{fill:#222436;fill:var(--s2)}.ss2{stroke:#222436;stroke:var(--s2)}.ftx{fill:#c0caf5;fill:var(--tx)}.stx{stroke:#c0caf5;stroke:var(--tx)}.fmu{fill:#9aa3c7;fill:var(--mu)}.smu{stroke:#9aa3c7;stroke:var(--mu)}.ffa{fill:#7b84a8;fill:var(--fa)}.sfa{stroke:#7b84a8;stroke:var(--fa)}.fac{fill:#7aa2f7;fill:var(--ac)}.sac{stroke:#7aa2f7;stroke:var(--ac)}.fag{fill:#bb9af7;fill:var(--ag)}.sag{stroke:#bb9af7;stroke:var(--ag)}.fok{fill:#9ece6a;fill:var(--ok)}.sok{stroke:#9ece6a;stroke:var(--ok)}.fwn{fill:#e0af68;fill:var(--wn)}.swn{stroke:#e0af68;stroke:var(--wn)}.fbd{fill:#2b2e40;fill:var(--bd)}.sbd{stroke:#2b2e40;stroke:var(--bd)}.fbc{fill:#5a6184;fill:var(--bc)}.sbc{stroke:#5a6184;stroke:var(--bc)}.foa{fill:#0e0f14;fill:var(--oa)}.soa{stroke:#0e0f14;stroke:var(--oa)}text{font:13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#c0caf5;fill:var(--tx)}.h{font-size:20px;font-weight:600}.sm{font-size:12px}.b{font-weight:600}.m{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}.e{text-anchor:end}.c{text-anchor:middle}.n{fill:none}</style><rect class="fbg" width="100%" height="100%"/><rect class="fac" x="24" y="20" width="3" height="24"/><rect class="fag" x="33" y="20" width="3" height="24" opacity=".6"/><text class="h" x="50" y="40">What exists today, and how far</text><text class="fmu sm" x="24" y="66">Per domain, strictly from reports 42, 44 and 45 (2026-11-05). Filled mark: seen on screen. Ring: unit tests</text><text class="fmu sm" x="24" y="81">only.</text><text class="ftx b sm c" x="560" y="100">Shipped</text><text class="ftx b sm c" x="650" y="92">Engine ready,</text><text class="ftx b sm c" x="650" y="106">no interface</text><text class="ftx b sm c" x="740" y="100">Envisaged</text><g transform="translate(0 128)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Typing, undo, tabs</text><text class="fmu sm" x="24" y="11">Text visible and saved, 3 tabs (44 a, b)</text><circle class="fac" cx="560" cy="0" r="9"/></g><g transform="translate(0 164)"><text class="ftx b" x="24" y="-3">Search and replace</text><text class="fmu sm" x="24" y="11">Find, Replace All in one undo, Find in Files (44 c, f)</text><circle class="fac" cx="560" cy="0" r="9"/></g><g transform="translate(0 200)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Encodings, line endings</text><text class="fmu sm" x="24" y="11">UTF-16 LE + BOM + CRLF round trip on disk (44 h)</text><circle class="fac" cx="560" cy="0" r="9"/></g><g transform="translate(0 236)"><text class="ftx b" x="24" y="-3">Syntax colouring</text><text class="fmu sm" x="24" y="11">9 of 30 languages seen on screen (44 l)</text><circle class="fac" cx="560" cy="0" r="9"/></g><g transform="translate(0 272)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Crash recovery</text><text class="fmu sm" x="24" y="11">Text back and marked modified (45 bug 2)</text><circle class="fac" cx="560" cy="0" r="9"/></g><g transform="translate(0 308)"><text class="ftx b" x="24" y="-3">Durable save, dated backups</text><text class="fmu sm" x="24" y="11">Atomic write and backups: unit tests only (45, 42)</text><circle class="sac n" cx="560" cy="0" r="8" stroke-width="2.5"/></g><g transform="translate(0 344)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">User tools, command palette</text><text class="fmu sm" x="24" y="11">Streamed tool output, palette filter (44 e, g)</text><circle class="fac" cx="560" cy="0" r="9"/></g><g transform="translate(0 380)"><text class="ftx b" x="24" y="-3">100 MB files</text><text class="fmu sm" x="24" y="11">Opens in ~350 ms; each keypress takes 312-374 ms (44 i)</text><circle class="fac" cx="560" cy="0" r="9"/></g><g transform="translate(0 416)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Multiple carets</text><text class="fmu sm" x="24" y="11">Commands collapse to the last region (42 s.4.6)</text><path class="fag" d="M650 -10l10 10l-10 10l-10 -10z"/></g><g transform="translate(0 452)"><text class="ftx b" x="24" y="-3">Replace in Files</text><text class="fmu sm" x="24" y="11">Engine merged and tested, no dialog (42 s.4.7)</text><path class="fag" d="M650 -10l10 10l-10 10l-10 -10z"/></g><g transform="translate(0 488)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Quick Open, settings, keymap, encoding picker</text><text class="fmu sm" x="24" y="11">View models exist, no views (42 s.4)</text><path class="fag" d="M650 -10l10 10l-10 10l-10 -10z"/></g><g transform="translate(0 524)"><text class="ftx b" x="24" y="-3">External change watch</text><text class="fmu sm" x="24" y="11">Merged, not driven by the shell (42 s.4.10)</text><path class="fag" d="M650 -10l10 10l-10 10l-10 -10z"/></g><g transform="translate(0 560)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Agents, MCP</text><text class="fmu sm" x="24" y="11">MCP client mock-tested on a local tokio stub (42)</text><path class="fag" d="M650 -10l10 10l-10 10l-10 -10z"/></g><g transform="translate(0 596)"><text class="ftx b" x="24" y="-3">SSH, SFTP</text><text class="fmu sm" x="24" y="11">Only a local-folder model; no SSH library</text><rect class="n sbc" x="731" y="-9" width="18" height="18" rx="3" stroke-width="2" stroke-dasharray="4 3"/></g><g transform="translate(0 632)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Plugins (WebAssembly)</text><text class="fmu sm" x="24" y="11">Host written against a local stub; cannot run</text><rect class="n sbc" x="731" y="-9" width="18" height="18" rx="3" stroke-width="2" stroke-dasharray="4 3"/></g><g transform="translate(0 668)"><text class="ftx b" x="24" y="-3">Notes, vault</text><text class="fmu sm" x="24" y="11">Design study only (internal notes)</text><rect class="n sbc" x="731" y="-9" width="18" height="18" rx="3" stroke-width="2" stroke-dasharray="4 3"/></g><g transform="translate(0 704)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Live collaboration (CRDT)</text><text class="fmu sm" x="24" y="11">loro is a local stub</text><rect class="n sbc" x="731" y="-9" width="18" height="18" rx="3" stroke-width="2" stroke-dasharray="4 3"/></g><text class="ffa sm" x="24" y="746">Source: re/42 (integration, section 4 not wired), re/44 (screens), re/45 (data integrity); stubs in crates/stubs.</text><text class="ffa sm" x="24" y="761">A mark never claims more than the report states.</text></svg>