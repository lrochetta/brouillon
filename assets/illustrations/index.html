<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Illustrations preview</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="illustrations.css">
<style>
:root{--bg:#fbfaf7;--surface:#f1f0eb;--surface-2:#e8e6df;--text:#1a1b26;--text-muted:#4a4f6a;--text-faint:#5c6283;--accent:#2f4fd0;--agent:#7a3fd0;--agent-tint:#efe8fb;--ok:#3d6b12;--warn:#8a5a00;--danger:#b3203f;--border:#dcdad2;--border-ctrl:#8a8fa6;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#14151c;--surface:#1a1b26;--surface-2:#222436;--text:#c0caf5;--text-muted:#9aa3c7;--text-faint:#7b84a8;--accent:#7aa2f7;--agent:#bb9af7;--agent-tint:#262238;--ok:#9ece6a;--warn:#e0af68;--danger:#f7768e;--border:#2b2e40;--border-ctrl:#5a6184}}
html:has(#t-dark:checked){--bg:#14151c;--surface:#1a1b26;--surface-2:#222436;--text:#c0caf5;--text-muted:#9aa3c7;--text-faint:#7b84a8;--accent:#7aa2f7;--agent:#bb9af7;--agent-tint:#262238;--ok:#9ece6a;--warn:#e0af68;--danger:#f7768e;--border:#2b2e40;--border-ctrl:#5a6184;color-scheme:dark}
html:has(#t-light:checked){--bg:#fbfaf7;--surface:#f1f0eb;--surface-2:#e8e6df;--text:#1a1b26;--text-muted:#4a4f6a;--text-faint:#5c6283;--accent:#2f4fd0;--agent:#7a3fd0;--agent-tint:#efe8fb;--ok:#3d6b12;--warn:#8a5a00;--danger:#b3203f;--border:#dcdad2;--border-ctrl:#8a8fa6;color-scheme:light}
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font:14px Inter,"Segoe UI",Arial,sans-serif}
h1,h2{font-size:16px;margin:24px 0 12px}.bar{display:flex;gap:16px;align-items:center}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.c{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}.c.w{grid-column:span 2}
.c .a svg{width:100%;height:auto;display:block}.c.i .a svg{width:96px;height:96px}.c.e .a svg{width:200px;height:auto}
figcaption{color:var(--text-muted);font-size:12px;margin-top:8px}.im{max-width:300px;margin:0 12px 12px 0;background:var(--surface);border-radius:8px}
</style></head><body>
