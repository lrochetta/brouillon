<svg xmlns="http://www.w3.org/2000/svg" class="il" role="img" viewBox="0 0 800 360" width="800" height="360" lang="fr"><title>Vos fichiers restent sur votre machine</title><desc>Schéma : les fichiers et le cadenas sont à l'intérieur de votre machine, sans nuage par défaut. Un nuage grisé en pointillés, marqué optionnel, représente un fournisseur d'IA que vous choisiriez. Aperçu de conception pour la partie IA.</desc><style>.il{--i-bg:var(--bg,#14151c);--i-sf:var(--surface,#1a1b26);--i-s2:var(--surface-2,#222436);--i-tx:var(--text,#c0caf5);--i-mu:var(--text-muted,#9aa3c7);--i-fa:var(--text-faint,#7b84a8);--i-ac:var(--accent,#7aa2f7);--i-ag:var(--agent,#bb9af7);--i-at:var(--agent-tint,#262238);--i-ok:var(--ok,#9ece6a);--i-wn:var(--warn,#e0af68);--i-dg:var(--danger,#f7768e);--i-ln:var(--border,#2b2e40);--i-ct:var(--border-ctrl,#5a6184)}@media(prefers-color-scheme:light){.il{--i-bg:var(--bg,#fbfaf7);--i-sf:var(--surface,#f1f0eb);--i-s2:var(--surface-2,#e8e6df);--i-tx:var(--text,#1a1b26);--i-mu:var(--text-muted,#4a4f6a);--i-fa:var(--text-faint,#5c6283);--i-ac:var(--accent,#2f4fd0);--i-ag:var(--agent,#7a3fd0);--i-at:var(--agent-tint,#efe8fb);--i-ok:var(--ok,#3d6b12);--i-wn:var(--warn,#8a5a00);--i-dg:var(--danger,#b3203f);--i-ln:var(--border,#dcdad2);--i-ct:var(--border-ctrl,#8a8fa6)}}.f-bg{fill:var(--i-bg)}.s-bg{stroke:var(--i-bg)}.f-sf{fill:var(--i-sf)}.s-sf{stroke:var(--i-sf)}.f-s2{fill:var(--i-s2)}.s-s2{stroke:var(--i-s2)}.f-tx{fill:var(--i-tx)}.s-tx{stroke:var(--i-tx)}.f-mu{fill:var(--i-mu)}.s-mu{stroke:var(--i-mu)}.f-fa{fill:var(--i-fa)}.s-fa{stroke:var(--i-fa)}.f-ac{fill:var(--i-ac)}.s-ac{stroke:var(--i-ac)}.f-ag{fill:var(--i-ag)}.s-ag{stroke:var(--i-ag)}.f-at{fill:var(--i-at)}.s-at{stroke:var(--i-at)}.f-ok{fill:var(--i-ok)}.s-ok{stroke:var(--i-ok)}.f-wn{fill:var(--i-wn)}.s-wn{stroke:var(--i-wn)}.f-dg{fill:var(--i-dg)}.s-dg{stroke:var(--i-dg)}.f-ln{fill:var(--i-ln)}.s-ln{stroke:var(--i-ln)}.f-ct{fill:var(--i-ct)}.s-ct{stroke:var(--i-ct)}.sw{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nf{fill:none}.o2{fill-opacity:.16}.o4{fill-opacity:.4}.dd{stroke-dasharray:4 4}.t{font:600 12px Inter,"Segoe UI",Arial,sans-serif}</style><rect x="70" y="80" width="360" height="200" rx="14" class="f-sf s-ct" stroke-width="2"/><rect x="70" y="80" width="360" height="30" rx="14" class="f-s2"/><rect x="70" y="96" width="360" height="14" class="f-s2"/><rect x="88" y="91" width="70" height="8" rx="4" class="f-mu"/><path d="M100 140 h22 l10 10 v32 h-32 z" class="f-sf s-ac" stroke-width="2"/><path d="M122 140 v10 h10" class="nf s-ac" stroke-width="2"/><path d="M107 164 h18 M107 172 h12" class="sw s-mu"/><path d="M160 140 h22 l10 10 v32 h-32 z" class="f-sf s-ac" stroke-width="2"/><path d="M182 140 v10 h10" class="nf s-ac" stroke-width="2"/><path d="M167 164 h18 M167 172 h12" class="sw s-mu"/><path d="M220 140 h22 l10 10 v32 h-32 z" class="f-sf s-ac" stroke-width="2"/><path d="M242 140 v10 h10" class="nf s-ac" stroke-width="2"/><path d="M227 164 h18 M227 172 h12" class="sw s-mu"/><path d="M130 204 h22 l10 10 v32 h-32 z" class="f-sf s-ac" stroke-width="2"/><path d="M152 204 v10 h10" class="nf s-ac" stroke-width="2"/><path d="M137 228 h18 M137 236 h12" class="sw s-mu"/><path d="M190 204 h22 l10 10 v32 h-32 z" class="f-sf s-ac" stroke-width="2"/><path d="M212 204 v10 h10" class="nf s-ac" stroke-width="2"/><path d="M197 228 h18 M197 236 h12" class="sw s-mu"/><rect x="316" y="170" width="70" height="56" rx="10" class="f-ok o2 s-ok" stroke-width="2"/><path d="M336 170 v-14 a15 15 0 0 1 30 0 v14" class="sw s-ok" transform="translate(0,14) translate(0,-14)"/><circle cx="351" cy="198" r="6" class="f-ok"/><path d="M30 300 H470" class="sw s-ct"/><path d="M430 200 H530" class="sw s-fa dd"/><path d="M600 232 a30 30 0 0 1 4 -59 a44 44 0 0 1 84 -8 a36 36 0 0 1 12 70 z" class="f-s2 s-fa dd" stroke-width="2" fill-opacity=".5"/><g><rect x="568" y="262" width="87" height="24" rx="12" class="nf s-fa dd" stroke-width="1.5"/><text x="580" y="278.5" cla