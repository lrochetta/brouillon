<svg xmlns="http://www.w3.org/2000/svg" class="il" role="img" viewBox="0 0 640 300" width="640" height="300" lang="en"><title>Download and verify</title><desc>An installer, a zip archive and a shield with a check mark representing SHA-256 verification. Both files are checked against the published hash.</desc><style>.il{--i-bg:var(--bg,#14151c);--i-sf:var(--surface,#1a1b26);--i-s2:var(--surface-2,#222436);--i-tx:var(--text,#c0caf5);--i-mu:var(--text-muted,#9aa3c7);--i-fa:var(--text-faint,#7b84a8);--i-ac:var(--accent,#7aa2f7);--i-ag:var(--agent,#bb9af7);--i-at:var(--agent-tint,#262238);--i-ok:var(--ok,#9ece6a);--i-wn:var(--warn,#e0af68);--i-dg:var(--danger,#f7768e);--i-ln:var(--border,#2b2e40);--i-ct:var(--border-ctrl,#5a6184)}@media(prefers-color-scheme:light){.il{--i-bg:var(--bg,#fbfaf7);--i-sf:var(--surface,#f1f0eb);--i-s2:var(--surface-2,#e8e6df);--i-tx:var(--text,#1a1b26);--i-mu:var(--text-muted,#4a4f6a);--i-fa:var(--text-faint,#5c6283);--i-ac:var(--accent,#2f4fd0);--i-ag:var(--agent,#7a3fd0);--i-at:var(--agent-tint,#efe8fb);--i-ok:var(--ok,#3d6b12);--i-wn:var(--warn,#8a5a00);--i-dg:var(--danger,#b3203f);--i-ln:var(--border,#dcdad2);--i-ct:var(--border-ctrl,#8a8fa6)}}.f-bg{fill:var(--i-bg)}.s-bg{stroke:var(--i-bg)}.f-sf{fill:var(--i-sf)}.s-sf{stroke:var(--i-sf)}.f-s2{fill:var(--i-s2)}.s-s2{stroke:var(--i-s2)}.f-tx{fill:var(--i-tx)}.s-tx{stroke:var(--i-tx)}.f-mu{fill:var(--i-mu)}.s-mu{stroke:var(--i-mu)}.f-fa{fill:var(--i-fa)}.s-fa{stroke:var(--i-fa)}.f-ac{fill:var(--i-ac)}.s-ac{stroke:var(--i-ac)}.f-ag{fill:var(--i-ag)}.s-ag{stroke:var(--i-ag)}.f-at{fill:var(--i-at)}.s-at{stroke:var(--i-at)}.f-ok{fill:var(--i-ok)}.s-ok{stroke:var(--i-ok)}.f-wn{fill:var(--i-wn)}.s-wn{stroke:var(--i-wn)}.f-dg{fill:var(--i-dg)}.s-dg{stroke:var(--i-dg)}.f-ln{fill:var(--i-ln)}.s-ln{stroke:var(--i-ln)}.f-ct{fill:var(--i-ct)}.s-ct{stroke:var(--i-ct)}.sw{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nf{fill:none}.o2{fill-opacity:.16}.o4{fill-opacity:.4}.dd{stroke-d