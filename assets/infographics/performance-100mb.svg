<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="perf-t perf-d"><title id="perf-t">100 MB file: opens in 211 ms plus 50 ms in the engine, search in 164 ms</title><desc id="perf-d">Bars in milliseconds. Engine benchmark on a 109.6 MB, 1.5 million line file: read and decode 211.4 ms, rope build 50.3 ms, literal search count 164 ms, regex search count 44.1 ms. Through the window the file opens in about 350 ms, but each typed key takes 312 to 374 ms to repaint, far above the 16.6 ms of one frame.</desc><style>svg{--i-bg:var(--bg,#14151c);--i-sf:var(--surface,#1a1b26);--i-s2:var(--surface-2,#222436);--i-tx:var(--text,#c0caf5);--i-mu:var(--text-muted,#9aa3c7);--i-fa:var(--text-faint,#7b84a8);--i-ac:var(--accent,#7aa2f7);--i-ag:var(--agent,#bb9af7);--i-ok:var(--ok,#9ece6a);--i-wn:var(--syn-num,#ff9e64);--i-bd:var(--border,#2b2e40);--i-bc:var(--border-ctrl,#5a6184);--i-oa:var(--on-accent,#0e0f14);--i-cy:var(--syn-type,#7dcfff)}@media(prefers-color-scheme:light){svg{--i-bg:var(--bg,#fbfaf7);--i-sf:var(--surface,#f1f0eb);--i-s2:var(--surface-2,#e8e6df);--i-tx:var(--text,#1a1b26);--i-mu:var(--text-muted,#4a4f6a);--i-fa:var(--text-faint,#5c6283);--i-ac:var(--accent,#2f4fd0);--i-ag:var(--agent,#7a3fd0);--i-ok:var(--ok,#3d6b12);--i-wn:var(--syn-num,#a34400);--i-bd:var(--border,#dcdad2);--i-bc:var(--border-ctrl,#8a8fa6);--i-oa:var(--on-accent,#ffffff);--i-cy:var(--syn-type,#006a8e)}}.fbg{fill:#14151c;fill:var(--i-bg)}.sbg{stroke:#14151c;stroke:var(--i-bg)}.fsf{fill:#1a1b26;fill:var(--i-sf)}.ssf{stroke:#1a1b26;stroke:var(--i-sf)}.fs2{fill:#222436;fill:var(--i-s2)}.ss2{stroke:#222436;stroke:var(--i-s2)}.ftx{fill:#c0caf5;fill:var(--i-tx)}.stx{stroke:#c0caf5;stroke:var(--i-tx)}.fmu{fill:#9aa3c7;fill:var(--i-mu)}.smu{stroke:#9aa3c7;stroke:var(--i-mu)}.ffa{fill:#7b84a8;fill:var(--i-fa)}.sfa{stroke:#7b84a8;stroke:var(--i-fa)}.fac{fill:#7aa2f7;fill:var(--i-ac)}.sac{stroke:#7aa2f7;stroke:var(--i-ac)}.fag{fill:#bb9af7;fill:var(--i-ag)}.sag{stroke:#bb9af7;stroke:var(--i-ag)}.fok{fill:#9ece6a;fill:var(--i-ok)}.sok{stroke:#9ece6a;stroke:var(--i-ok)}.fwn{fill:#ff9e64;fill:var(--i-wn)}.swn{stroke:#ff9e64;stroke:var(--i-wn)}.fbd{fill:#2b2e40;fill:var(--i-bd)}.sbd{stroke:#2b2e40;stroke:var(--i-bd)}.fbc{fill:#5a6184;fill:var(--i-bc)}.sbc{stroke:#5a6184;stroke:var(--i-bc)}.foa{fill:#0e0f14;fill:var(--i-oa)}.soa{stroke:#0e0f14;stroke:var(--i-oa)}.fcy{fill:#7dcfff;fill:var(--i-cy)}.scy{stroke:#7dcfff;stroke:var(--i-cy)}text{font:13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#c0caf5;fill:var(--i-tx)}.h{font-size:20px;font-weight:600}.sm{font-size:12px}.b{font-weight:600}.m{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}.e{text-anchor:end}.c{text-anchor:middle}.n{fill:none}</style><rect class="fbg" width="100%" height="100%"/><rect class="fac" x="24" y="20" width="4" height="22" rx="2"/><rect class="n sag" x="34.5" y="21.5" width="3.5" height="19" rx="1.75" stroke-width="2"/><text class="h" x="56" y="40">A 100 MB file: open and search</text><text class="fmu sm" x="24" y="66">Milliseconds, lower is better. Blue: engine benchmark. Amber: measured through the window or a single run.</text><line class="smu" x1="213.24" y1="90" x2="213.24" y2="398" stroke-width="2" stroke-dasharray="5 4"/><text class="fmu sm b" x="219.24" y="412">16.6 ms: one frame at 60 Hz</text><text class="sm b" x="24" y="96">Open a 109.6 MB file (1.5 million lines)</text><text class="ftx sm" x="24" y="123">Read and decode</text><rect class="fac" x="190" y="106" width="296" height="24" rx="3"/><text class="foa b" x="198" y="123">211.4 ms</text><text class="fmu sm" x="494" y="123">median of 3</text><text class="ftx sm" x="24" y="153">Build the rope</text><rect class="fac" x="190" y="136" width="70.4" height="24" rx="3"/><text class="foa b" x="198" y="153">50.3 ms</text><text class="fmu sm" x="268.4" y="153">median of 3</text><text class="ftx sm" x="24" y="183">Window opens 100 MB file</text><rect class="fwn" x="190" y="166" width="490" height="24" rx="3"/><text class="foa b" x="198" y="183">350 ms</text><text class="fmu sm" x="688" y="183">about, seen once</text><text class="sm b" x="24" y="224">Search the whole file</text><text class="ftx sm" x="24" y="251">Literal, count</text><rect class="fac" x="190" y="234" width="229.6" height="24" rx="3"/><text class="foa b" x="198" y="251">164 ms</text><text class="fmu sm" x="427.6" y="251">median of 3</text><text class="ftx sm" x="24" y="281">Regex, count</text><rect class="fac" x="190" y="264" width="61.7" height="24" rx="3"/><text class="foa b" x="198" y="281">44.1 ms</text><text class="fmu sm" x="259.7" y="281">median of 3</text><text class="ftx sm" x="24" y="311">1,000,000 hits in 51 MB</text><rect class="fwn" x="190" y="294" width="158.2" height="24" rx="3"/><text class="foa b" x="198" y="311">113 ms</text><text class="fmu sm" x="356.2" y="311">one run</text><text class="sm b" x="24" y="352">Typing in the window, 100 MB file</text><text class="ftx sm" x="24" y="379">One key, repaint</text><rect class="fwn" x="190" y="362" width="523.6" height="24" rx="3"/><text class="foa b" x="198" y="379">312-374 ms</text><text class="fmu sm" x="721.6" y="379"></text><text class="fwn sm" x="24" y="440">Engine, same file, medians: insert one character 0.1 us, undo 0.2 us, fetch and lay out 80 lines 23 us. The 312-374 ms per key is the cost</text><text class="fwn sm" x="24" y="455">of repainting the whole window at 100 MB (build 110), not of the edit. It is far above one frame: this is a known weakness, not a result to boast of.</text><text class="ffa sm" x="24" y="488">Windows 11 Pro, Intel Iris Xe iGPU, Avast active, release build. Engine: cargo bench -p brouillon --bench large_file (re/43 section 5, 2026-11-05).</text><text class="ffa sm" x="24" y="503">Window: scenario i of re/44 (2026-11-05, one run). 1,000,000 hits: perf_count_50mb, lto thin, one run (re/42 section 5).</text></svg>
