<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="status-t status-d"><title id="status-t">Status matrix: available, engine ready, planned</title><desc id="status-d">Seventeen domains. Available and seen on screen: typing and tabs, search and replace, encodings, syntax colouring, crash recovery, user tools and palette, 100 MB files. Available, unit tests only: durable save and backups. Engine ready, not wired to the interface: multiple carets, Replace in Files, Quick Open and editors, external change watch, agents and MCP. Planned: SSH, plugins, notes, collaboration.</desc><style>svg{--i-bg:var(--bg,#14151c);--i-sf:var(--surface,#1a1b26);--i-s2:var(--surface-2,#222436);--i-tx:var(--text,#c0caf5);--i-mu:var(--text-muted,#9aa3c7);--i-fa:var(--text-faint,#7b84a8);--i-ac:var(--accent,#7aa2f7);--i-ag:var(--agent,#bb9af7);--i-ok:var(--ok,#9ece6a);--i-wn:var(--syn-num,#ff9e64);--i-bd:var(--border,#2b2e40);--i-bc:var(--border-ctrl,#5a6184);--i-oa:var(--on-accent,#0e0f14);--i-cy:var(--syn-type,#7dcfff)}@media(prefers-color-scheme:light){svg{--i-bg:var(--bg,#fbfaf7);--i-sf:var(--surface,#f1f0eb);--i-s2:var(--surface-2,#e8e6df);--i-tx:var(--text,#1a1b26);--i-mu:var(--text-muted,#4a4f6a);--i-fa:var(--text-faint,#5c6283);--i-ac:var(--accent,#2f4fd0);--i-ag:var(--agent,#7a3fd0);--i-ok:var(--ok,#3d6b12);--i-wn:var(--syn-num,#a34400);--i-bd:var(--border,#dcdad2);--i-bc:var(--border-ctrl,#8a8fa6);--i-oa:var(--on-accent,#ffffff);--i-cy:var(--syn-type,#006a8e)}}.fbg{fill:#14151c;fill:var(--i-bg)}.sbg{stroke:#14151c;stroke:var(--i-bg)}.fsf{fill:#1a1b26;fill:var(--i-sf)}.ssf{stroke:#1a1b26;stroke:var(--i-sf)}.fs2{fill:#222436;fill:var(--i-s2)}.ss2{stroke:#222436;stroke:var(--i-s2)}.ftx{fill:#c0caf5;fill:var(--i-tx)}.stx{stroke:#c0caf5;stroke:var(--i-tx)}.fmu{fill:#9aa3c7;fill:var(--i-mu)}.smu{stroke:#9aa3c7;stroke:var(--i-mu)}.ffa{fill:#7b84a8;fill:var(--i-fa)}.sfa{stroke:#7b84a8;stroke:var(--i-fa)}.fac{fill:#7aa2f7;fill:var(--i-ac)}.sac{stroke:#7aa2f7;stroke:var(--i-ac)}.fag{fill:#bb9af7;fill:var(--i-ag)}.sag{stroke:#bb9af7;stroke:var(--i-ag)}.fok{fill:#9ece6a;fill:var(--i-ok)}.sok{stroke:#9ece6a;stroke:var(--i-ok)}.fwn{fill:#ff9e64;fill:var(--i-wn)}.swn{stroke:#ff9e64;stroke:var(--i-wn)}.fbd{fill:#2b2e40;fill:var(--i-bd)}.sbd{stroke:#2b2e40;stroke:var(--i-bd)}.fbc{fill:#5a6184;fill:var(--i-bc)}.sbc{stroke:#5a6184;stroke:var(--i-bc)}.foa{fill:#0e0f14;fill:var(--i-oa)}.soa{stroke:#0e0f14;stroke:var(--i-oa)}.fcy{fill:#7dcfff;fill:var(--i-cy)}.scy{stroke:#7dcfff;stroke:var(--i-cy)}text{font:13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#c0caf5;fill:var(--i-tx)}.h{font-size:20px;font-weight:600}.sm{font-size:12px}.b{font-weight:600}.m{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}.e{text-anchor:end}.c{text-anchor:middle}.n{fill:none}</style><rect class="fbg" width="100%" height="100%"/><rect class="fac" x="24" y="20" width="4" height="22" rx="2"/><rect class="n sag" x="34.5" y="21.5" width="3.5" height="19" rx="1.75" stroke-width="2"/><text class="h" x="56" y="40">What exists today, and how far</text><text class="fmu sm" x="24" y="66">Per domain, strictly from reports 42, 44 and 45 (2026-11-05). Check on a filled disc: seen on screen. Check</text><text class="fmu sm" x="24" y="81">on a ring: unit tests only.</text><text class="ftx b sm c" x="560" y="100">Available</text><text class="ftx b sm c" x="650" y="100">Engine ready</text><text class="ftx b sm c" x="740" y="100">Planned</text><g transform="translate(0 128)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Typing, undo, tabs</text><text class="fmu sm" x="24" y="11">Text visible and saved, 3 tabs (44 a, b)</text><circle class="fok" cx="560" cy="0" r="10"/><path class="n soa" stroke-width="2.4" d="M555 0l3.5 3.5l6.5 -7.5"/></g><g transform="translate(0 164)"><text class="ftx b" x="24" y="-3">Search and replace</text><text class="fmu sm" x="24" y="11">Find, Replace All in one undo, Find in Files (44 c, f)</text><circle class="fok" cx="560" cy="0" r="10"/><path class="n soa" stroke-width="2.4" d="M555 0l3.5 3.5l6.5 -7.5"/></g><g transform="translate(0 200)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Encodings, line endings</text><text class="fmu sm" x="24" y="11">UTF-16 LE + BOM + CRLF round trip on disk (44 h)</text><circle class="fok" cx="560" cy="0" r="10"/><path class="n soa" stroke-width="2.4" d="M555 0l3.5 3.5l6.5 -7.5"/></g><g transform="translate(0 236)"><text class="ftx b" x="24" y="-3">Syntax colouring</text><text class="fmu sm" x="24" y="11">9 of 30 languages seen on screen (44 l)</text><circle class="fok" cx="560" cy="0" r="10"/><path class="n soa" stroke-width="2.4" d="M555 0l3.5 3.5l6.5 -7.5"/></g><g transform="translate(0 272)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Crash recovery</text><text class="fmu sm" x="24" y="11">Text back and marked modified (45 bug 2)</text><circle class="fok" cx="560" cy="0" r="10"/><path class="n soa" stroke-width="2.4" d="M555 0l3.5 3.5l6.5 -7.5"/></g><g transform="translate(0 308)"><text class="ftx b" x="24" y="-3">Durable save, dated backups</text><text class="fmu sm" x="24" y="11">Atomic write and backups: unit tests only (45, 42)</text><circle class="n sok" cx="560" cy="0" r="9" stroke-width="2.5"/><path class="n sok" stroke-width="2.4" d="M555 0l3.5 3.5l6.5 -7.5"/></g><g transform="translate(0 344)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">User tools, command palette</text><text class="fmu sm" x="24" y="11">Streamed tool output, palette filter (44 e, g)</text><circle class="fok" cx="560" cy="0" r="10"/><path class="n soa" stroke-width="2.4" d="M555 0l3.5 3.5l6.5 -7.5"/></g><g transform="translate(0 380)"><text class="ftx b" x="24" y="-3">100 MB files</text><text class="fmu sm" x="24" y="11">Opens in ~350 ms; each keypress takes 312-374 ms (44 i)</text><circle class="fok" cx="560" cy="0" r="10"/><path class="n soa" stroke-width="2.4" d="M555 0l3.5 3.5l6.5 -7.5"/></g><g transform="translate(0 416)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Multiple carets</text><text class="fmu sm" x="24" y="11">Commands collapse to the last region (42 s.4.6)</text><circle class="n scy" cx="650" cy="0" r="9" stroke-width="2"/><path class="fcy" d="M641 0a9 9 0 0 0 18 0z"/></g><g transform="translate(0 452)"><text class="ftx b" x="24" y="-3">Replace in Files</text><text class="fmu sm" x="24" y="11">Engine merged and tested, no dialog (42 s.4.7)</text><circle class="n scy" cx="650" cy="0" r="9" stroke-width="2"/><path class="fcy" d="M641 0a9 9 0 0 0 18 0z"/></g><g transform="translate(0 488)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Quick Open, settings, keymap, encoding picker</text><text class="fmu sm" x="24" y="11">View models exist, no views (42 s.4)</text><circle class="n scy" cx="650" cy="0" r="9" stroke-width="2"/><path class="fcy" d="M641 0a9 9 0 0 0 18 0z"/></g><g transform="translate(0 524)"><text class="ftx b" x="24" y="-3">External change watch</text><text class="fmu sm" x="24" y="11">Merged, not driven by the shell (42 s.4.10)</text><circle class="n scy" cx="650" cy="0" r="9" stroke-width="2"/><path class="fcy" d="M641 0a9 9 0 0 0 18 0z"/></g><g transform="translate(0 560)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Agents, MCP</text><text class="fmu sm" x="24" y="11">MCP client mock-tested on a local tokio stub (42)</text><circle class="n scy" cx="650" cy="0" r="9" stroke-width="2"/><path class="fcy" d="M641 0a9 9 0 0 0 18 0z"/></g><g transform="translate(0 596)"><text class="ftx b" x="24" y="-3">SSH, SFTP</text><text class="fmu sm" x="24" y="11">Only a local-folder model; no SSH library</text><circle class="n sag" cx="740" cy="0" r="9" stroke-width="2" stroke-dasharray="4 3"/></g><g transform="translate(0 632)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Plugins (WebAssembly)</text><text class="fmu sm" x="24" y="11">Host written against a local stub; cannot run</text><circle class="n sag" cx="740" cy="0" r="9" stroke-width="2" stroke-dasharray="4 3"/></g><g transform="translate(0 668)"><text class="ftx b" x="24" y="-3">Notes, vault</text><text class="fmu sm" x="24" y="11">Design study only (internal notes)</text><circle class="n sag" cx="740" cy="0" r="9" stroke-width="2" stroke-dasharray="4 3"/></g><g transform="translate(0 704)"><rect class="fsf" x="16" y="-22" width="768" height="36" rx="3"/><text class="ftx b" x="24" y="-3">Live collaboration (CRDT)</text><text class="fmu sm" x="24" y="11">loro is a local stub</text><circle class="n sag" cx="740" cy="0" r="9" stroke-width="2" stroke-dasharray="4 3"/></g><text class="ffa sm" x="24" y="746">Source: re/42 (integration, section 4 not wired), re/44 (screens), re/45 (data integrity); stubs in crates/stubs.</text><text class="ffa sm" x="24" y="761">A mark never claims more than the report states.</text></svg>
