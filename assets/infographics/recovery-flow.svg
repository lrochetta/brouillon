<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="recovery-t recovery-d"><title id="recovery-t">Recovery flow: you type, journal, unexpected stop, relaunch, text returns marked modified</title><desc id="recovery-d">Five steps. You type; unsaved text is written to a recovery journal every 30 seconds; the process stops unexpectedly; on relaunch the journal is read and merged; the text comes back with a modified dot on the tab and a status bar message. Steps 3 to 5 were seen on screen in report 45; steps 1 and 2 are code and unit tests. Scroll and fold position are not restored.</desc><style>svg{--i-bg:var(--bg,#14151c);--i-sf:var(--surface,#1a1b26);--i-s2:var(--surface-2,#222436);--i-tx:var(--text,#c0caf5);--i-mu:var(--text-muted,#9aa3c7);--i-fa:var(--text-faint,#7b84a8);--i-ac:var(--accent,#7aa2f7);--i-ag:var(--agent,#bb9af7);--i-ok:var(--ok,#9ece6a);--i-wn:var(--syn-num,#ff9e64);--i-bd:var(--border,#2b2e40);--i-bc:var(--border-ctrl,#5a6184);--i-oa:var(--on-accent,#0e0f14);--i-cy:var(--syn-type,#7dcfff)}@media(prefers-color-scheme:light){svg{--i-bg:var(--bg,#fbfaf7);--i-sf:var(--surface,#f1f0eb);--i-s2:var(--surface-2,#e8e6df);--i-tx:var(--text,#1a1b26);--i-mu:var(--text-muted,#4a4f6a);--i-fa:var(--text-faint,#5c6283);--i-ac:var(--accent,#2f4fd0);--i-ag:var(--agent,#7a3fd0);--i-ok:var(--ok,#3d6b12);--i-wn:var(--syn-num,#a34400);--i-bd:var(--border,#dcdad2);--i-bc:var(--border-ctrl,#8a8fa6);--i-oa:var(--on-accent,#ffffff);--i-cy:var(--syn-type,#006a8e)}}.fbg{fill:#14151c;fill:var(--i-bg)}.sbg{stroke:#14151c;stroke:var(--i-bg)}.fsf{fill:#1a1b26;fill:var(--i-sf)}.ssf{stroke:#1a1b26;stroke:var(--i-sf)}.fs2{fill:#222436;fill:var(--i-s2)}.ss2{stroke:#222436;stroke:var(--i-s2)}.ftx{fill:#c0caf5;fill:var(--i-tx)}.stx{stroke:#c0caf5;stroke:var(--i-tx)}.fmu{fill:#9aa3c7;fill:var(--i-mu)}.smu{stroke:#9aa3c7;stroke:var(--i-mu)}.ffa{fill:#7b84a8;fill:var(--i-fa)}.sfa{stroke:#7b84a8;stroke:var(--i-fa)}.fac{fill:#7aa2f7;fill:var(--i-ac)}.sac{stroke:#7aa2f7;stroke:var(--i-ac)}.fag{fill:#bb9af7;fill:var(--i-ag)}.sag{stroke:#bb9af7;stroke:var(--i-ag)}.fok{fill:#9ece6a;fill:var(--i-ok)}.sok{stroke:#9ece6a;stroke:var(--i-ok)}.fwn{fill:#ff9e64;fill:var(--i-wn)}.swn{stroke:#ff9e64;stroke:var(--i-wn)}.fbd{fill:#2b2e40;fill:var(--i-bd)}.sbd{stroke:#2b2e40;stroke:var(--i-bd)}.fbc{fill:#5a6184;fill:var(--i-bc)}.sbc{stroke:#5a6184;stroke:var(--i-bc)}.foa{fill:#0e0f14;fill:var(--i-oa)}.soa{stroke:#0e0f14;stroke:var(--i-oa)}.fcy{fill:#7dcfff;fill:var(--i-cy)}.scy{stroke:#7dcfff;stroke:var(--i-cy)}text{font:13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#c0caf5;fill:var(--i-tx)}.h{font-size:20px;font-weight:600}.sm{font-size:12px}.b{font-weight:600}.m{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}.e{text-anchor:end}.c{text-anchor:middle}.n{fill:none}</style><rect class="fbg" width="100%" height="100%"/><rect class="fac" x="24" y="20" width="4" height="22" rx="2"/><rect class="n sag" x="34.5" y="21.5" width="3.5" height="19" rx="1.75" stroke-width="2"/><text class="h" x="56" y="40">When it stops unexpectedly, your text comes back</text><text class="fmu sm" x="24" y="66">Recovery of unsaved text, as fixed and checked on screen in report 45 (2026-11-05).</text><rect class="fsf sbd" x="24" y="96" width="132" height="262" rx="6"/><circle class="fs2 smu" cx="46" cy="122" r="13"/><text class="ftx b c" x="46" y="127">1</text><text class="ftx b" x="36" y="158">You type</text><text class="fmu sm" x="36" y="196">Edits go to the</text><text class="fmu sm" x="36" y="211">buffer. The</text><text class="fmu sm" x="36" y="226">journal is written</text><text class="fmu sm" x="36" y="241">every 30 s.</text><text class="fwn sm b" x="36" y="346">Not seen</text><text class="fmu sm" x="36" y="314">code, 42 section 3</text><path class="sac n" stroke-width="2" d="M160 136h12m-6 -5l6 5l-6 5"/><rect class="fsf sbd" x="178" y="96" width="132" height="262" rx="6"/><circle class="fs2 smu" cx="200" cy="122" r="13"/><text class="ftx b c" x="200" y="127">2</text><text class="ftx b" x="190" y="158">Recovery</text><text class="ftx b" x="190" y="174">journal</text><text class="fmu sm" x="190" y="196">Unsaved text is</text><text class="fmu sm" x="190" y="211">kept on disk with</text><text class="fmu sm" x="190" y="226">an atomic, fsynced</text><text class="fmu sm" x="190" y="241">write.</text><text class="fwn sm b" x="190" y="346">Not seen</text><text class="fmu sm" x="190" y="314">unit tests, 45 bug</text><text class="fmu sm" x="190" y="328">4</text><path class="sac n" stroke-width="2" d="M314 136h12m-6 -5l6 5l-6 5"/><rect class="fsf sbd" x="332" y="96" width="132" height="262" rx="6"/><circle class="fac" cx="354" cy="122" r="13"/><text class="foa b c" x="354" y="127">3</text><text class="ftx b" x="344" y="158">Unexpected</text><text class="ftx b" x="344" y="174">stop</text><text class="fmu sm" x="344" y="196">The process is</text><text class="fmu sm" x="344" y="211">killed (kill -9 in</text><text class="fmu sm" x="344" y="226">the test harness).</text><text class="fok sm b" x="344" y="346">Seen</text><text class="fmu sm" x="344" y="314">seen on screen, 44</text><text class="fmu sm" x="344" y="328">k</text><path class="sac n" stroke-width="2" d="M468 136h12m-6 -5l6 5l-6 5"/><rect class="fsf sbd" x="486" y="96" width="132" height="262" rx="6"/><circle class="fac" cx="508" cy="122" r="13"/><text class="foa b c" x="508" y="127">4</text><text class="ftx b" x="498" y="158">Relaunch</text><text class="fmu sm" x="498" y="196">The journal is</text><text class="fmu sm" x="498" y="211">read at start-up</text><text class="fmu sm" x="498" y="226">and merged into</text><text class="fmu sm" x="498" y="241">the session.</text><text class="fok sm b" x="498" y="346">Seen</text><text class="fmu sm" x="498" y="314">seen on screen, 45</text><text class="fmu sm" x="498" y="328">bug 2</text><path class="sac n" stroke-width="2" d="M622 136h12m-6 -5l6 5l-6 5"/><rect class="fsf sbd" x="640" y="96" width="132" height="262" rx="6"/><circle class="fac" cx="662" cy="122" r="13"/><text class="foa b c" x="662" y="127">5</text><text class="ftx b" x="652" y="158">Text is back</text><text class="fmu sm" x="652" y="196">Marked modified:</text><text class="fmu sm" x="652" y="211">dot on the tab and</text><text class="fmu sm" x="652" y="226">sidebar. Status</text><text class="fmu sm" x="652" y="241">bar says N unsaved</text><text class="fmu sm" x="652" y="256">document(s) were</text><text class="fmu sm" x="652" y="271">recovered.</text><text class="fok sm b" x="652" y="346">Seen</text><text class="fmu sm" x="652" y="314">seen on screen, 45</text><text class="fmu sm" x="652" y="328">after-k2</text><rect class="fsf sbd" x="24" y="378" width="752" height="46" rx="6"/><text class="ftx b" x="36" y="398">Normal close:</text><text class="fmu" x="132" y="398">unsaved tabs come back modified, the journal is kept (seen, 45 after-d5-reopened).</text><text class="ffa sm" x="36" y="416">A tab you drew on keeps its strokes in a .sketch.json file next to the document (seen, 45 after-o4).</text><text class="fwn sm" x="24" y="452">Not shown, because not verified: scroll and fold position (not restored), recovery of a file changed on disk since the crash</text><text class="fwn sm" x="24" y="467">(the journal text wins silently), the in-place fallback on network shares. Up to 30 s of typing can be missing (deduced from the interval).</text><text class="ffa sm" x="24" y="500">Windows 11, 175 % DPI, AZERTY, smoke harness tools/smoke. Source: re/45 bugs 1 to 4 and open items, re/44 scenario k, re/42 section 3.</text></svg>
