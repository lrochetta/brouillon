<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="arch-t arch-d"><title id="arch-t">Architecture: five crates, 42,662 lines, and four local stubs</title><desc id="arch-d">Layers from top: brouillon application 4,701 lines, brouillon-ui 11,025 lines, brouillon-editor-engine 21,938 lines with brouillon-import 584 lines beside it, brouillon-core 4,414 lines. Core, engine and import contain no window or view code, 26,936 lines, though core and engine use a few floem types in one file each. Four local stubs stand in for wasmtime, wasmtime-wasi, loro and tokio.</desc><style>svg{--i-bg:var(--bg,#14151c);--i-sf:var(--surface,#1a1b26);--i-s2:var(--surface-2,#222436);--i-tx:var(--text,#c0caf5);--i-mu:var(--text-muted,#9aa3c7);--i-fa:var(--text-faint,#7b84a8);--i-ac:var(--accent,#7aa2f7);--i-ag:var(--agent,#bb9af7);--i-ok:var(--ok,#9ece6a);--i-wn:var(--syn-num,#ff9e64);--i-bd:var(--border,#2b2e40);--i-bc:var(--border-ctrl,#5a6184);--i-oa:var(--on-accent,#0e0f14);--i-cy:var(--syn-type,#7dcfff)}@media(prefers-color-scheme:light){svg{--i-bg:var(--bg,#fbfaf7);--i-sf:var(--surface,#f1f0eb);--i-s2:var(--surface-2,#e8e6df);--i-tx:var(--text,#1a1b26);--i-mu:var(--text-muted,#4a4f6a);--i-fa:var(--text-faint,#5c6283);--i-ac:var(--accent,#2f4fd0);--i-ag:var(--agent,#7a3fd0);--i-ok:var(--ok,#3d6b12);--i-wn:var(--syn-num,#a34400);--i-bd:var(--border,#dcdad2);--i-bc:var(--border-ctrl,#8a8fa6);--i-oa:var(--on-accent,#ffffff);--i-cy:var(--syn-type,#006a8e)}}.fbg{fill:#14151c;fill:var(--i-bg)}.sbg{stroke:#14151c;stroke:var(--i-bg)}.fsf{fill:#1a1b26;fill:var(--i-sf)}.ssf{stroke:#1a1b26;stroke:var(--i-sf)}.fs2{fill:#222436;fill:var(--i-s2)}.ss2{stroke:#222436;stroke:var(--i-s2)}.ftx{fill:#c0caf5;fill:var(--i-tx)}.stx{stroke:#c0caf5;stroke:var(--i-tx)}.fmu{fill:#9aa3c7;fill:var(--i-mu)}.smu{stroke:#9aa3c7;stroke:var(--i-mu)}.ffa{fill:#7b84a8;fill:var(--i-fa)}.sfa{stroke:#7b84a8;stroke:var(--i-fa)}.fac{fill:#7aa2f7;fill:var(--i-ac)}.sac{stroke:#7aa2f7;stroke:var(--i-ac)}.fag{fill:#bb9af7;fill:var(--i-ag)}.sag{stroke:#bb9af7;stroke:var(--i-ag)}.fok{fill:#9ece6a;fill:var(--i-ok)}.sok{stroke:#9ece6a;stroke:var(--i-ok)}.fwn{fill:#ff9e64;fill:var(--i-wn)}.swn{stroke:#ff9e64;stroke:var(--i-wn)}.fbd{fill:#2b2e40;fill:var(--i-bd)}.sbd{stroke:#2b2e40;stroke:var(--i-bd)}.fbc{fill:#5a6184;fill:var(--i-bc)}.sbc{stroke:#5a6184;stroke:var(--i-bc)}.foa{fill:#0e0f14;fill:var(--i-oa)}.soa{stroke:#0e0f14;stroke:var(--i-oa)}.fcy{fill:#7dcfff;fill:var(--i-cy)}.scy{stroke:#7dcfff;stroke:var(--i-cy)}text{font:13px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#c0caf5;fill:var(--i-tx)}.h{font-size:20px;font-weight:600}.sm{font-size:12px}.b{font-weight:600}.m{font-family:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}.e{text-anchor:end}.c{text-anchor:middle}.n{fill:none}</style><rect class="fbg" width="100%" height="100%"/><rect class="fac" x="24" y="20" width="4" height="22" rx="2"/><rect class="n sag" x="34.5" y="21.5" width="3.5" height="19" rx="1.75" stroke-width="2"/><text class="h" x="56" y="40">Five crates, 42,662 lines of Rust</text><text class="fmu sm" x="24" y="66">Raw line count of .rs files (blank lines, comments and inline tests included), working tree on 2026-11-05.</text><text class="fmu sm" x="24" y="81">Lines link a crate to what it depends on (simplified).</text><rect class="fsf sbd" x="24" y="92" width="480" height="56" rx="6"/><text class="ftx b m" x="36" y="114">brouillon</text><text class="fmu sm" x="36" y="132">application: window, wiring, start-up</text><text class="ftx b e" x="492" y="114">4,701 lines</text><rect class="fsf sbd" x="24" y="172" width="480" height="56" rx="6"/><text class="ftx b m" x="36" y="194">brouillon-ui</text><text class="fmu sm" x="36" y="212">views: tabs, find bar, palette, panels</text><text class="ftx b e" x="492" y="194">11,025 lines</text><rect class="fsf sbd" x="24" y="252" width="330" height="74" rx="6"/><text class="ftx b m" x="36" y="274">brouillon-editor-engine</text><text class="fmu sm" x="36" y="292">buffer, undo, search, encodings, recovery, tools, syntax</text><text class="ftx b e" x="342" y="274">21,938 lines</text><rect class="fsf sbd" x="374" y="252" width="130" height="74" rx="6"/><text class="ftx b m" x="386" y="274">-import</text><text class="fmu sm" x="386" y="292">importers</text><text class="ftx b" x="386" y="312">584 lines</text><rect class="fsf sbd" x="24" y="350" width="480" height="56" rx="6"/><text class="ftx b m" x="36" y="372">brouillon-core</text><text class="fmu sm" x="36" y="390">contract, settings, theme, keymap, file types</text><text class="ftx b e" x="492" y="372">4,414 lines</text><path class="smu n" stroke-width="1.5" d="M264 148v24M264 228v24M439 228v24M264 326v24"/><rect class="n sac" x="16" y="244" width="496" height="170" rx="10" stroke-width="2" stroke-dasharray="2 5"/><text class="fac sm b" x="24" y="438">No window and no view: core + engine + import = 26,936 lines</text><text class="ffa sm" x="24" y="454">Honest limit: core links the floem crate for one colour type (theme.rs), engine for key and signal types (cursor.rs).</text><rect class="n sag" x="540" y="92" width="236" height="170" rx="6" stroke-width="2" stroke-dasharray="6 4"/><text class="fag b" x="552" y="114">Local stubs (not the real crates)</text><text class="ftx m" x="552" y="142">wasmtime</text><text class="fmu e" x="764" y="142">150 lines</text><text class="ftx m" x="552" y="164">wasmtime-wasi</text><text class="fmu e" x="764" y="164">30 lines</text><text class="ftx m" x="552" y="186">loro</text><text class="fmu e" x="764" y="186">114 lines</text><text class="ftx m" x="552" y="208">tokio</text><text class="fmu e" x="764" y="208">243 lines</text><text class="fmu sm" x="552" y="238">Plugins, collaboration and MCP</text><text class="fmu sm" x="552" y="253">transport run against these.</text><text class="ftx b" x="540" y="296">Also measured</text><text class="fmu sm" x="540" y="316">939 tests passed, 0 failed</text><text class="fmu sm" x="540" y="334">(cargo test --workspace, report 45)</text><text class="fmu sm" x="540" y="352">Release binary 14.69 MB (report 43)</text><text class="fmu sm" x="540" y="370">29 highlighters + Rust: see syntax map</text><text class="ffa sm" x="24" y="486">Source: crates/*/Cargo.toml and wc -l on crates/**/*.rs in _bmad-output/build/poc-floem, HEAD e75b00f plus working tree; re/45; re/43 section 6.</text></svg>
