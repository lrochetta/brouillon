<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="memory-t memory-d"><title id="memory-t">Idle memory of Brouillon: 294.6 MB, 151.7 MB, 60.9 MB</title><desc id="memory-d">Horizontal bars of the process working set at rest on one Windows 11 machine with an Intel iGPU. Empty document: 294.6 MB with Vulkan before the work, 151.7 MB with Direct3D 12, 60.9 MB with the CPU renderer, which is the default. With a 100,000-line file: 351.7, 201.0 and 94.2 MB. The goal of under 80 MB is an objective and is met only by the CPU renderer on an empty document.</desc><style>svg{--i-bg:var(--bg,#14151c);--i-sf:var(--surface,#1a1b26);--i-s2:var(--surface-2,#222436);--i-tx:var(--text,#c0caf5);--i-mu:var(--text-muted,#9aa3c7);--i-fa:var(--text-faint,#7b84a8);--i-ac:var(--accent,#7aa2f7);--i-ag:var(--agent,#bb9af7);--i-ok:var(--ok,#9ece6a);--i-wn:var(--syn-num,#ff9e64);--i-bd:var(--border,#2b2e40);--i-bc:var(--border-ctrl,#5a6184);--i-oa:var(--on-accent,#0e0f14);--i-cy:var(--syn-type,#7dcfff)}@media(prefers-color-scheme:light){svg{--i-bg:var(--bg,#fbfaf7);--i-sf:var(--surface,#f1f0eb);--i-s2:var(--surface-2,#e8e6df);--i-tx:var(--text,#1a1b26);--i-mu:var(--text-muted,#4a4f6a);--i-fa:var(--text-faint,#5c6283);--i-ac:var(--accent,#2f4fd0);--i-ag:var(--agent,#7a3fd0);--i-ok:var(--ok,#3d6b12);--i-wn:var(--syn-num,#a34400);--i-bd:var(--border,#dcdad2);--i-bc:var(--border-ctrl,#8a8fa6);--i-oa:var(--on-accent,#ffffff);--i-cy:var(--syn-type,#006a8e)}}.fbg{fill:#14151c;fill:var(--i-bg)}.sbg{stroke:#14151c;stroke:var(--i-bg)}.fsf{fill:#1a1b26;fill:var(--i-sf)}.ssf{stroke:#1a1b26;stroke:var(--i-sf)}.fs2{fill:#222436;fill:var(--i-s2)}.ss2{stroke:#222436;stroke:var(--i-s2)}.ftx{fill:#c0caf5;fill:var(--i-tx)}.stx{stroke:#c0caf5;stroke:var(--i-tx)}.fmu{fill:#9aa3c7;fill:var(--i-mu)}.smu{stroke:#9aa3c7;stroke:var(--i-mu)}.ffa{fill:#7b84a8;fill:var(--i-fa)}.sfa{stroke:#7b84a8;stroke:var(--i-fa)}.fac{fill:#7aa2f7;fill:var(--i-ac)}