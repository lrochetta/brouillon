 y="180">Direct3D 12</text><rect class="fwn" x="190" y="158" width="204.8" height="34" rx="3"/><text class="foa b" font-size="15" x="200" y="180">151.7 MB</text><text class="fmu sm e" x="790" y="180">151.6–153.4</text><text class="ftx" x="24" y="226">CPU renderer (default)</text><rect class="fac" x="190" y="204" width="82.2" height="34" rx="3"/><text class="foa b" font-size="15" x="200" y="226">60.9 MB</text><text class="fmu sm e" x="790" y="226">60.9–61.1</text><text class="ftx" x="24" y="306">Before (Vulkan)</text><rect class="fs2 smu" x="190" y="284" width="474.8" height="34" rx="3"/><text class="ftx b" font-size="15" x="200" y="306">351.7 MB</text><text class="fmu sm e" x="790" y="306">344.6–359.5</text><text class="ftx" x="24" y="352">Direct3D 12</text><rect class="fwn" x="190" y="330" width="271.4" height="34" rx="3"/><text class="foa b" font-size="15" x="200" y="352">201.0 MB</text><text class="fmu sm e" x="790" y="352">183.5–203.5</text><text class="ftx" x="24" y="398">CPU renderer (default)</text><rect class="fac" x="190" y="376" width="127.2" height="34" rx="3"/><text class="foa b" font-size="15" x="200" y="398">94.2 MB</text><text class="fmu sm e" x="790" y="398">92.2–97.9</text><text class="ffa sm c" x="190" y="440">0</text><text class="ffa sm c" x="325" y="440">100</text><text class="ffa sm c" x="460" y="440">200</text><text class="ffa sm c" x="595" y="440">300</text><text class="ffa sm" x="635.5" y="440">MB</text><text class="ffa sm" x="24" y="466">Windows 11 Pro, Intel Iris Xe iGPU (shared memory), Avast active. Release build, median of 5 launches (empty document),</text><text class="ffa sm" x="24" y="481">sampled after the first-frame log line. CPU renderer = default since 2026-11-05. Measured 2026-11-05. Source: re/43 sections 1 and 3.</text></svg>
