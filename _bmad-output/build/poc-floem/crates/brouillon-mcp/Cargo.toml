[package]
name = "brouillon-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "Brouillon Link: opt-in MCP server core (JSON-RPC, tools, policy, audit, IPC) and the stdio relay binary. No GUI types."

[lib]
path = "src/lib.rs"

[[bin]]
name = "brouillon-mcp"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true
interprocess.workspace = true
rand.workspace = true
toml.workspace = true
brouillon-secrets = { path = "../brouillon-secrets" }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes"] }
