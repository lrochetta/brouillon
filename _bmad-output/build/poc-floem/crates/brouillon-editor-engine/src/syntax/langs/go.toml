name = "Go"
extensions = ["go"]
case_sensitive = true
functions = true
operators = "+-*/%=<>!&|^~:"
line_comments = ["//"]
block_comments = [["/*", "*/"]]

[[string]]
open = "`"
multiline = true

[[string]]
open = '"'
escape = '\'

[[string]]
open = "'"
escape = '\'

[[keywords]]
name = "Keywords"
words = '''
break case chan const continue default defer else fallthrough for func go goto if
import interface map package range return select struct switch type var
'''

[[keywords]]
name = "Types"
kind = "type"
words = '''
bool byte complex64 complex128 error float32 float64 int int8 int16 int32 int64
rune string uint uint8 uint16 uint32 uint64 uintptr any comparable
'''

[[keywords]]
name = "Builtins"
words = "append cap clear close copy delete len make max min new panic print println recover complex real imag"

[[keywords]]
name = "Constants"
words = "true false iota nil"
