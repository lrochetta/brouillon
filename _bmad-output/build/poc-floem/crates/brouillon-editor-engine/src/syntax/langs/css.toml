name = "CSS"
extensions = ["css", "scss", "less", "pcss"]
case_sensitive = false
functions = true
number = "css"
word_chars = "-"
operators = ">+~*"
block_comments = [["/*", "*/"]]

[[string]]
open = '"'
escape = '\'

[[string]]
open = "'"
escape = '\'

[[prefix]]
chars = "."
kind = "type"

[[prefix]]
chars = "#"
kind = "attribute"

[[prefix]]
chars = "@"
kind = "preprocessor"

