[[keywords]]
name = "Values"
words = '''
absolute alternate always auto backwards baseline block bold bolder both bottom
break-word capitalize center collapse column column-reverse contain content-box
cover dashed default dotted double ease ease-in ease-in-out ease-out ellipsis end
fixed flex flex-end flex-start forwards grid groove hidden infinite inherit initial
inline inline-block inline-flex inline-grid inset italic justify left lighter
line-through linear lowercase middle no-repeat none normal nowrap oblique outset
overline pointer pre pre-line pre-wrap relative repeat repeat-x repeat-y reverse
ridge right row row-reverse scroll separate smooth solid space-around space-between
space-evenly start static sticky stretch sub super table text top transparent
underline unset uppercase visible wrap wrap-reverse important
black white red green blue yellow orange purple pink gray grey brown cyan magenta
silver gold navy teal maroon olive lime aqua currentColor
'''

