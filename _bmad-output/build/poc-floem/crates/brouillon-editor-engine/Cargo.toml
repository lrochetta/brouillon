[package]
name = "brouillon-editor-engine"
version = "0.1.0-alpha.16"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
brouillon-core = { path = "../brouillon-core" }
# Remote editing: the helper protocol types (separate workspace, path dependency) and the safe-save engine.
brouillon-remote-proto = { path = "../../../remote-helper/crates/brouillon-remote-proto" }
brouillon-safesave = { path = "../brouillon-safesave" }
# Secret vault (DPAPI-wrapped file): used only by the `Credentials` service. brouillon-mcp must never depend on it.
brouillon-vault = { path = "../brouillon-vault" }
# Lazy text store for huge files (the Buffer backing above the lazy threshold).
brouillon-textstore-spike = { path = "../brouillon-textstore-spike" }
memchr = "2"
floem.workspace = true

crop.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
regex.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
rfd.workspace = true
loro.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
tokio.workspace = true
encoding_rs.workspace = true
arboard.workspace = true
linkify.workspace = true
serde_json.workspace = true
rand.workspace = true
rand_chacha.workspace = true
ignore.workspace = true
globset.workspace = true
notify.workspace = true
chardetng.workspace = true
memmap2.workspace = true
similar.workspace = true
tempfile.workspace = true
unicode-segmentation.workspace = true
sha2.workspace = true
md-5.workspace = true
base64.workspace = true
fancy-regex = { workspace = true, optional = true }

[dev-dependencies]
# The REAL helper (protocol server) running in-process over a fake SFTP server, for the client tests.
brouillon-remote = { path = "../../../remote-helper/crates/brouillon-remote" }

[features]
# Lot 3: lookbehind/backreference regex mode (BK-022). Off by default.
fancy-regex = ["dep:fancy-regex"]
# Dev hooks for the on-screen test harness; never enabled in a shipped build.
test-input = []
