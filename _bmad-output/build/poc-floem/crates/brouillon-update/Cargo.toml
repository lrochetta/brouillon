[package]
name = "brouillon-update"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "Signed automatic update for Brouillon: manifest, Ed25519 verification, download, policy. No UI."

[dependencies]
# HTTPS client. rustls + ring, no OpenSSL, no gzip (nothing to decompress), no cookies.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Pure-Rust Ed25519 (same family as tools/release).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
