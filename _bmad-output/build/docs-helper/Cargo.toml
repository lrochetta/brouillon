# Standalone workspace for the optional documents helper (`brouillon-docs.exe`).
# Deliberately NOT a member of ../poc-floem nor ../remote-helper: own dependency tree, no network crates.
[workspace]
resolver = "2"
members = ["crates/brouillon-docs-proto", "crates/brouillon-docs"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Laurent Rochetta"]
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
