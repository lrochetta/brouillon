# git-cliff configuration — auto-generate CHANGELOG.md from Conventional Commits.
# Run with: `git cliff -o CHANGELOG.md`
# Project policy in docs/VERSIONING.md.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

While the project is in **0.x**, anything MAY break between minor versions.
"""
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} **[BREAKING]**{% endif %}
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = "<!-- generated by git-cliff -->\n"

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat",     group = "Added" },
  { message = "^add",      group = "Added" },
  { message = "^fix",      group = "Fixed" },
  { message = "^perf",     group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^style",    group = "Changed" },
  { message = "^revert",   group = "Reverted" },
  { message = "^docs",     group = "Documentation" },
  { message = "^test",     group = "Tests" },
  { message = "^chore",    group = "Internal" },
  { message = "^build",    group = "Internal" },
  { message = "^ci",       group = "Internal" },
  { message = "^security", group = "Security" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
